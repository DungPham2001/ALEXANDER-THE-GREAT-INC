    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9eef7"/>
      <stop offset="1" stop-color="#a9b8d3"/>
    </linearGradient>
    <linearGradient id="glass2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9d4e8"/>
      <stop offset="1" stop-color="#7f93b6"/>
