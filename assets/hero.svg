    <path d="M238 560 q-70 -20 -110 20 q60 -30 110 -6z M238 560 q60 -50 120 -20 q-60 -6 -120 26z M238 560 q-20 -60 30 -90 q-20 50 -30 90z M238 560 q-70 -60 -110 -40 q60 0 110 40z"/>
